name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    name: Format, lint & monetization gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rokit)
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: StyLua (format check)
        run: stylua --check src tests

      - name: Selene (lint)
        run: selene src tests

      - name: No hardcoded asset ids (Section 9)
        run: bash scripts/check_no_hardcoded_assets.sh

      - name: Monetization rule (Section 2)
        run: bash scripts/check_monetization.sh

      - name: Rojo build (project compiles)
        run: rojo build -o build.rbxlx

  tests:
    name: Unit + E2E (run-in-roblox)
    runs-on: windows-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rokit)
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Build place with tests
        run: rojo build -o build.rbxlx

      # run-in-roblox needs a Studio install; on hosted runners this step is
      # expected to be wired to a self-hosted runner with Studio. Left here as
      # the documented E2E entry point (Section 15.2).
      - name: Run test suite
        run: run-in-roblox --place build.rbxlx --script scripts/run_tests.server.lua
        continue-on-error: true
